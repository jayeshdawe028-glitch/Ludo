name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/bot/package.json
      - name: Install
        run: npm install --prefix apps/bot
      - name: Build
        run: npm --prefix apps/bot run build
      - name: Docker build
        run: docker build -t aarohi-ci .
